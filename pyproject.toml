[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-render"
version = "0.1.0"
description = "Echo Render — ECHO's companion renderer: a fast, deterministic CPU point-cloud & wireframe renderer (numpy + numba; engine codename MUS). No GPU, no browser."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "REDrighthand05" }]
keywords = ["point-cloud", "renderer", "numba", "numpy", "software-rendering"]
dependencies = [
    "numpy",
    "numba>=0.58",
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/REDrighthand05/echo-render"

[tool.setuptools]
packages = ["echo_render"]
